name: Aplicar 60 rangos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-60-ranks.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar escala e insignias
        run: python scripts/apply_60_ranks.py
      - name: Guardar cambios
        run: |
          git config user.name "Ranking8BP Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app-v5.js
          git commit -m "Activar 60 rangos e insignias por ELO"
          git push
